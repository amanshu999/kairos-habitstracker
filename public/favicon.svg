<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background terminal card -->
  <rect width="64" height="64" rx="14" fill="#090a0f"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="url(#glow)" stroke-width="2" stroke-opacity="0.8"/>
  
  <!-- Subtle scanline accent -->
  <line x1="8" y1="16" x2="56" y2="16" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.2"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.1"/>
  <line x1="8" y1="48" x2="56" y2="48" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.1"/>

  <!-- Command prompt chevron >_ -->
  <path d="M16 22L28 32L16 42" stroke="url(#glow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)"/>
  <line x1="32" y1="42" x2="48" y2="42" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" filter="url(#neon-glow)"/>
</svg>
